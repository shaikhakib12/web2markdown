<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageScribe</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="theme-system">
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <div class="brand-text">
          <span class="brand-name">PageScribe</span>
          <span class="brand-tag">Text-Only</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
          <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button id="optionsBtn" class="icon-btn" title="Settings" aria-label="Open Settings">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Info Card -->
    <section class="page-card">
      <div class="page-title-row">
        <h2 id="pageTitle" class="page-title" title="Webpage title">Loading active tab...</h2>
      </div>
      <div class="page-url-row">
        <svg class="url-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span id="pageUrl" class="page-url" title="Webpage URL">https://...</span>
      </div>
      <div id="selectionBadge" class="selection-badge hidden">
        <span class="pulse-dot"></span>
        <span id="selectionText">Selection detected</span>
      </div>
    </section>

    <!-- Extraction Mode Selector -->
    <nav class="mode-tabs" aria-label="Extraction Mode">
      <button id="modeArticle" class="mode-btn active" data-mode="article">
        <span class="mode-label">Article</span>
      </button>
      <button id="modeFullText" class="mode-btn" data-mode="fulltext">
        <span class="mode-label">Full Text</span>
      </button>
      <button id="modeSelection" class="mode-btn" data-mode="selection">
        <span class="mode-label">Selection</span>
      </button>
    </nav>

    <!-- Main Content State Container -->
    <main class="content-area">
      <!-- Loading View -->
      <div id="loadingView" class="state-view hidden">
        <div class="spinner"></div>
        <p id="loadingMessage" class="state-text">Extracting meaningful text...</p>
      </div>

      <!-- Error View -->
      <div id="errorView" class="state-view hidden">
        <div class="error-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <h3 id="errorHeading" class="error-heading">Cannot Extract Page</h3>
        <p id="errorMessage" class="error-message">This page cannot be accessed by PageScribe.</p>
        <button id="errorRetryBtn" class="secondary-btn">Retry Extraction</button>
      </div>

      <!-- Converted Result View -->
      <div id="resultView" class="state-view">
        <!-- View Toggle & Sub-actions -->
        <div class="view-header">
          <div class="view-switch" role="tablist">
            <button id="viewPreviewBtn" class="view-toggle-btn active" role="tab" aria-selected="true">Preview</button>
            <button id="viewRawBtn" class="view-toggle-btn" role="tab" aria-selected="false">Raw Markdown</button>
          </div>
          <div class="quick-meta-actions">
            <button id="copyTitleBtn" class="pill-btn" title="Copy Title">Copy Title</button>
            <button id="copyUrlBtn" class="pill-btn" title="Copy URL">Copy URL</button>
          </div>
        </div>

        <!-- Rendered HTML Preview Container -->
        <div id="previewContainer" class="markdown-body preview-scroll">
          <p class="placeholder-text">Click "Convert to Markdown" below to begin.</p>
        </div>

        <!-- Raw Markdown Textarea -->
        <div id="rawContainer" class="raw-scroll hidden">
          <textarea id="rawMarkdownText" readonly placeholder="# Markdown output will appear here..."></textarea>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
          <div class="stats-group">
            <span class="stat-item"><strong id="wordCount">0</strong> words</span>
            <span class="stat-sep">&bull;</span>
            <span class="stat-item"><strong id="charCount">0</strong> chars</span>
          </div>
          <div class="stats-right">
            <span id="activeModeBadge" class="mode-indicator">Article Mode</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Actions -->
    <footer class="app-footer">
      <div class="footer-actions">
        <button id="convertBtn" class="primary-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span id="convertBtnText">Convert to Markdown</span>
        </button>

        <button id="copyMarkdownBtn" class="secondary-btn" title="Copy Markdown to Clipboard">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copyBtnText">Copy</span>
        </button>

        <button id="downloadBtn" class="secondary-btn" title="Download as .md file">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Download</span>
        </button>
      </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite">
      <span id="toastMessage">Copied to clipboard!</span>
    </div>
  </div>

  <!-- Local Bundled Libraries & Scripts -->
  <script src="../lib/readability.js"></script>
  <script src="../lib/turndown.js"></script>
  <script src="../lib/turndown-plugin-gfm.js"></script>
  <script src="../scripts/sanitizer.js"></script>
  <script src="../scripts/converter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
